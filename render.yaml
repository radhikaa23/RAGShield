services:
  - type: web
    name: ragshield-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RAGSHIELD_ACCESS_TOKEN
        sync: false
      - key: RAGSHIELD_DEMO_MODE
        value: "true"
